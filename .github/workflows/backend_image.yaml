name: Build and Push Backend Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          sparse-checkout: Backend

      - name: Get Version
        id: Version
        shell: pwsh
        run: |
          $version = Select-Xml -Path ./apps/backend/backend.csproj -XPath "//Version" |
            Select-Object -ExpandProperty Node |
            Select-Object -ExpandProperty InnerText

          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile.app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/meguurl-backend-repo:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/meguurl-backend-repo:latest
