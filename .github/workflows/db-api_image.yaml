name: Build and Push Database API Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Database API
        uses: actions/checkout@v4

      - name: Get Version
        id: Version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('./apps/db-api/pyproject.toml', 'rb'))['project']['version'])"

          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/db-api
          file: ./apps/db-api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/meguchat-db-api-repo:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/meguchat-db-api-repo:latest
